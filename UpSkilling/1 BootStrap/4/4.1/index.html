<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sidebar Layout</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-4">

    <div class="row">

        <!-- Sidebar -->
        <div class="col-md-3 bg-dark text-white p-4">

            <h3>Sidebar</h3>
            <hr>

            <ul class="nav flex-column">
                <li class="nav-item">
                    <a href="#" class="nav-link text-white">Home</a>
                </li>

                <li class="nav-item">
                    <a href="#" class="nav-link text-white">About</a>
                </li>

                <li class="nav-item">
                    <a href="#" class="nav-link text-white">Services</a>
                </li>

                <li class="nav-item">
                    <a href="#" class="nav-link text-white">Gallery</a>
                </li>

                <li class="nav-item">
                    <a href="#" class="nav-link text-white">Contact</a>
                </li>
            </ul>

        </div>

        <!-- Main Content -->
        <div class="col-md-9 bg-light p-4">

            <h2>Main Content</h2>

            <p>
                This is the main content section of the webpage.
                It occupies 9 columns on medium and larger screens.
            </p>

            <div class="card mt-3">
                <div class="card-body">
                    <h5 class="card-title">Bootstrap Layout</h5>
                    <p class="card-text">
                        This layout demonstrates the use of the Bootstrap
                        grid system with a sidebar and content area.
                    </p>

                    <button class="btn btn-primary">
                        Read More
                    </button>
                </div>
            </div>

        </div>

    </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
