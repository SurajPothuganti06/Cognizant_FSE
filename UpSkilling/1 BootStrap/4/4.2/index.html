<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Four Column Layout</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">

    <h2 class="text-center mb-4">
        Four Equal Columns
    </h2>

    <div class="row">

        <!-- Column 1 -->
        <div class="col-sm-3">
            <div class="bg-primary text-white text-center p-4 rounded mb-3">
                <h4>Column 1</h4>
                <p>First Column</p>
            </div>
        </div>

        <!-- Column 2 -->
        <div class="col-sm-3">
            <div class="bg-success text-white text-center p-4 rounded mb-3">
                <h4>Column 2</h4>
                <p>Second Column</p>
            </div>
        </div>

        <!-- Column 3 -->
        <div class="col-sm-3">
            <div class="bg-warning text-dark text-center p-4 rounded mb-3">
                <h4>Column 3</h4>
                <p>Third Column</p>
            </div>
        </div>

        <!-- Column 4 -->
        <div class="col-sm-3">
            <div class="bg-danger text-white text-center p-4 rounded mb-3">
                <h4>Column 4</h4>
                <p>Fourth Column</p>
            </div>
        </div>

    </div>

</div>

<!-- Bootstrap JavaScript -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
