<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alignment in Bootstrap Grid</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">

    <h2 class="text-center mb-4">
        justify-content-center & align-items-center
    </h2>

    <div class="row justify-content-center align-items-center bg-light border"
         style="height:300px;">

        <div class="col-md-4">
            <div class="bg-primary text-white text-center p-4 rounded">
                <h4>Column 1</h4>
                <p>Centered Horizontally & Vertically</p>
            </div>
        </div>

        <div class="col-md-4">
            <div class="bg-success text-white text-center p-4 rounded">
                <h4>Column 2</h4>
                <p>Bootstrap Alignment Example</p>
            </div>
        </div>

    </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
