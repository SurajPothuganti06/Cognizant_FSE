<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Text Transformation</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">

    <h2 class="text-center mb-4">
        Bootstrap Text Transformation Utilities
    </h2>

    <div class="card p-4 shadow">

        <h4>Original Text</h4>
        <p>Welcome To Bootstrap 5 Learning</p>

        <hr>

        <h4>text-uppercase</h4>
        <p class="text-uppercase">
            Welcome To Bootstrap 5 Learning
        </p>

        <hr>

        <h4>text-lowercase</h4>
        <p class="text-lowercase">
            Welcome To Bootstrap 5 Learning
        </p>

        <hr>

        <h4>text-capitalize</h4>
        <p class="text-capitalize">
            welcome to bootstrap 5 learning
        </p>

    </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
